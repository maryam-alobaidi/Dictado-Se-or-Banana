<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictado Señor Banana</title>
<!-- relative base, so the build also works from a sub-folder (e.g. GitHub Pages) -->
<base href="./">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffd93b">
<!-- Apple home-screen icons -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png">

<!-- browser tab icons -->
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Señor Banana">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<script>
  // apply the saved theme before the page paints (light by default)
  try {
    if (localStorage.getItem('sb-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>
</head>
<body>
<app-root></app-root>
</body>
</html>
